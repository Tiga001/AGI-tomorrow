<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f1eb">
<meta name="description" content="一款关于研发 AGI 的极简文字游戏。做选择，管理资金，走向不同结局。">
<title>明天 AGI</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<header><span id="turnLabel">2021 · Q1</span><div class="header-actions"><div id="musicControl" class="music-control" data-sound="off"><button id="musicButton" class="text-button" aria-label="开启声音" aria-pressed="false">♫ 声音关</button><div id="musicVolumeWrap" class="music-volume" style="--volume-position:1"><div class="music-volume-track" aria-hidden="true"><span class="music-volume-fill"></span></div><input id="musicVolume" type="range" min="0" max="100" step="1" value="100" aria-label="背景音乐音量" aria-valuetext="100%" title="背景音乐音量，最左侧静音"></div></div><button id="restartButton" class="text-button">重开</button></div></header>
<div id="saveRecoveryNotice" class="save-recovery-notice" role="status" hidden><span id="saveRecoveryText"></span><button id="dismissSaveRecovery" type="button" aria-label="关闭存档恢复提示">×</button></div>
<div id="statusPanel" class="status-panel"><div id="stats" class="stats" aria-label="当前状态"></div><button id="scientists" class="scientists" type="button" aria-haspopup="dialog" aria-controls="scientistDialog">顶级科学家</button></div>
<div class="play-layout"><aside id="relationsPanel" class="relations-panel" aria-label="友商态度" hidden><div class="relations-heading"><h2 title="好感越高，合作机会越多；联合发布需要60好感。仅显示有实际往来的厂商，好感回到0仍保留。">友商态度</h2><button id="relationsToggle" class="relations-toggle" type="button" aria-label="收起友商态度" aria-expanded="true" aria-controls="relationsContent" title="收起友商态度"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button></div><div id="relationsContent" class="relations-content"><div id="relationsList"></div></div></aside><main id="game" tabindex="-1"></main></div>

</div>
<dialog id="scientistDialog" class="scientist-dialog" aria-labelledby="scientistDialogTitle"><div class="scientist-dialog-heading"><h2 id="scientistDialogTitle">顶级科学家</h2><button id="closeScientists" type="button" aria-label="关闭科学家名单">×</button></div><div id="scientistRoster"></div></dialog>
<dialog id="goalDialog" class="scientist-dialog" aria-labelledby="goalDialogTitle"><div class="scientist-dialog-heading"><h2 id="goalDialogTitle">AGI 目标</h2><button id="closeGoals" type="button" aria-label="关闭 AGI 目标">×</button></div><div id="goalProgress"></div></dialog>
<div class="sr-only" id="announcement" aria-live="polite"></div>

<audio id="eventSelectionSound" src="assets/sfx/focus-select.wav" preload="auto"></audio>
<script src="story.js"></script><script src="strategies.js"></script><script src="partners.js"></script><script src="worldlines.js"></script><script src="worldline-engine.js"></script><script src="game.js"></script><script src="music.js"></script><script src="sound.js"></script>
</body>
</html>
